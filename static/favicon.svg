<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="InterpScience">
  <!-- A four-star figure cut from the hero star map on the front page: bright
       nodes, faint links, the site's deep accent as the ground. Kept to four
       stars because the hero's fuller figures collapse into a blob at 16px. -->
  <defs>
    <linearGradient id="is-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24417f"/>
      <stop offset="100%" stop-color="#16264c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#is-tile)"/>
  <path d="M5.5 9.5 L12.5 24 L21 7.5 L27 21.5" fill="none" stroke="#9fb0d8"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f5f6f8">
    <circle cx="5.5" cy="9.5" r="2.7"/>
    <circle cx="12.5" cy="24" r="2.7"/>
    <circle cx="21" cy="7.5" r="3.1"/>
    <circle cx="27" cy="21.5" r="2.7"/>
  </g>
</svg>
